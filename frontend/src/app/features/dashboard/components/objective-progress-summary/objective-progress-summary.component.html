<app-ui-card customClass="h-full flex flex-col justify-between">
  <h2 class="text-sm font-bold text-slate-800 tracking-tight mb-2">Objective Progress</h2>

  <div>
    <div class="flex items-baseline gap-1.5 mb-3">
      <span class="text-2xl font-extrabold text-slate-900 leading-none">
        {{ dashboardService.objectiveProgress().planned }}
      </span>
      <span class="text-xs font-semibold text-slate-500">Planned</span>
    </div>

    <div class="h-3 w-full bg-slate-100 rounded-full flex overflow-hidden mb-4 border border-slate-200/60 p-0.5">
      <div class="h-full bg-emerald-500 rounded-l-full" style="width: 58.3%"></div>
      <div class="h-full bg-amber-500" style="width: 16.7%"></div>
      <div class="h-full bg-slate-400 rounded-r-full" style="width: 25%"></div>
    </div>

    <div class="space-y-1.5 text-xs font-semibold">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-xs bg-emerald-500"></span>
          <span class="text-slate-700">Completed</span>
        </div>
        <span class="text-slate-900 font-bold">{{ dashboardService.objectiveProgress().completed }}</span>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-xs bg-amber-500"></span>
          <span class="text-slate-700">In Progress</span>
        </div>
        <span class="text-slate-900 font-bold">{{ dashboardService.objectiveProgress().inProgress }}</span>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-xs bg-slate-400"></span>
          <span class="text-slate-700">Upcoming</span>
        </div>
        <span class="text-slate-900 font-bold">{{ dashboardService.objectiveProgress().upcoming }}</span>
      </div>
    </div>
  </div>
</app-ui-card>
