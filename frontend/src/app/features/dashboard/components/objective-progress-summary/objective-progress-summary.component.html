<app-ui-card customClass="h-full flex flex-col justify-between">
  <h2 class="text-sm font-bold text-brand-ink tracking-tight mb-2">Objective Progress</h2>

  <div>
    <div class="flex items-baseline gap-1.5 mb-3">
      <span class="text-2xl font-extrabold text-brand-ink leading-none">
        {{ dashboardService.objectiveProgress().planned }}
      </span>
      <span class="text-[10px] font-normal text-slate-500">Planned</span>
    </div>

    <div class="h-2 w-full bg-gray-100 rounded-full flex overflow-hidden mb-3">
      <div class="h-full bg-emerald-500 rounded-l-full" style="width: 58.3%"></div>
      <div class="h-full bg-amber-500" style="width: 16.7%"></div>
      <div class="h-full bg-gray-300 rounded-r-full" style="width: 25%"></div>
    </div>

    <div class="space-y-1 text-[10px] font-medium text-slate-600">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-sm bg-emerald-500"></span>
          <span>Completed</span>
        </div>
        <span class="font-semibold text-brand-ink">{{ dashboardService.objectiveProgress().completed }}</span>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-sm bg-amber-500"></span>
          <span>In Progress</span>
        </div>
        <span class="font-semibold text-brand-ink">{{ dashboardService.objectiveProgress().inProgress }}</span>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-sm bg-gray-300"></span>
          <span>Upcoming</span>
        </div>
        <span class="font-semibold text-brand-ink">{{ dashboardService.objectiveProgress().upcoming }}</span>
      </div>
    </div>
  </div>
</app-ui-card>
