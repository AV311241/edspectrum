<app-ui-card customClass="overall-progress-card">
  <h2 class="section-title">Overall Progress (Average %)</h2>

  <div class="metrics-grid">
    <div class="metric">
      <span class="metric-value baseline">
        {{ dashboardService.overallProgress().baseline }}%
      </span>
      <span class="metric-label">Baseline</span>
    </div>

    <div class="metric">
      <span class="metric-value current">
        {{ dashboardService.overallProgress().current }}%
      </span>
      <span class="metric-label">Current</span>
    </div>

    <div class="metric">
      <span class="metric-value increase">
        +{{ dashboardService.overallProgress().increase }}
      </span>
      <span class="metric-label">Increase</span>
    </div>
  </div>
</app-ui-card>
