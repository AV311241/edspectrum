<!-- Alert panel sits on the soft-pink brand surface per the spec. -->
<app-ui-card customClass="h-full flex flex-col justify-between !bg-brand-pink-soft !border-pink-100">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-sm font-bold text-brand-ink flex items-center gap-1.5">
      <span>Needs Attention</span>
    </h2>
    <button class="text-xs font-semibold text-brand-pink hover:text-brand-pink-dark transition-colors flex items-center gap-0.5">
      <span>View all</span>
      <span>&rarr;</span>
    </button>
  </div>

  <div class="space-y-2">
    @for (item of dashboardService.needsAttention(); track item.id) {
      <div class="flex items-start gap-2.5 p-1.5 rounded-lg bg-white/70 hover:bg-white transition-colors">
        <div class="w-5 h-5 rounded-full bg-red-500 text-white flex items-center justify-center shrink-0 mt-0.5">
          <span class="text-[10px] font-extrabold leading-none">!</span>
        </div>
        <div class="min-w-0">
          <h3 class="text-xs font-bold text-brand-ink leading-snug truncate">{{ item.title }}</h3>
          <p class="text-[11px] font-normal text-slate-500 truncate">{{ item.subtitle }}</p>
        </div>
      </div>
    }
  </div>
</app-ui-card>
