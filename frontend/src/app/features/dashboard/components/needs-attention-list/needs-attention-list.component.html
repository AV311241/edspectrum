<app-ui-card customClass="h-full flex flex-col justify-between">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-sm font-bold text-rose-700 flex items-center gap-1.5">
      <span>Needs Attention</span>
    </h2>
    <button class="text-xs font-semibold text-pink-700 hover:text-pink-900 transition-colors flex items-center gap-0.5">
      <span>View all</span>
      <span>→</span>
    </button>
  </div>

  <div class="space-y-2.5">
    @for (item of dashboardService.needsAttention(); track item.id) {
      <div class="flex items-start gap-2.5 p-2 rounded-xl bg-rose-50/40 border border-rose-100/60 hover:bg-rose-50 transition-colors">
        <div class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 mt-0.5 shadow-xs">
          <span class="text-xs font-extrabold leading-none">!</span>
        </div>
        <div class="min-w-0">
          <h3 class="text-xs font-bold text-slate-800 leading-snug truncate">{{ item.title }}</h3>
          <p class="text-[11px] font-medium text-slate-500 truncate">{{ item.subtitle }}</p>
        </div>
      </div>
    }
  </div>
</app-ui-card>
