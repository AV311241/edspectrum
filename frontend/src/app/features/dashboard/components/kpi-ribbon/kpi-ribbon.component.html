<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-5">
  @for (item of dashboardService.kpiMetrics(); track item.id) {
    <app-ui-card customClass="h-full !p-3 !flex-row items-center gap-3">
      <div [class]="'w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ' + item.badgeBg">
          <app-ui-icon [name]="item.icon" [size]="16" [className]="item.badgeIconColor" />
      </div>

      <div class="min-w-0 flex-1">
        <div class="text-xl font-extrabold text-brand-ink tracking-tight leading-tight tabular-nums">
          {{ item.value }}
        </div>
        <div class="text-[11px] font-semibold text-slate-600 mt-0.5 leading-tight break-words">
          {{ item.title }}
        </div>
        @if (item.subtext && item.subtext !== item.title) {
          <div class="text-[10px] font-medium text-slate-500 leading-tight mt-0.5 break-words">
            {{ item.subtext }}
          </div>
        }

        <div class="mt-1.5 text-[10px] font-semibold text-emerald-700 leading-tight">
          <span class="break-words">↑ {{ item.trend }}</span>
        </div>
      </div>
    </app-ui-card>
  }

  <!-- Motivational banner: italic quote on the soft-pink brand surface -->
  <div
    class="bg-gradient-to-r from-pink-100 to-pink-50 border border-pink-200/60 rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden shadow-card hover:shadow-card-hover transition-shadow min-h-[140px]">
    <div class="relative z-10">
      <p class="text-xs font-semibold italic text-brand-pink-dark leading-snug">
        "Every small step in English builds a bigger future."
      </p>
    </div>
    <div class="mt-4 flex items-end justify-between relative z-10">
      <div class="w-8 h-8 rounded-lg bg-brand-pink text-white flex items-center justify-center">
        <app-ui-icon name="academic-cap" [size]="16" />
      </div>
      <div class="w-12 h-12 bg-pink-200/50 rounded-full flex items-center justify-center">
        <app-ui-icon name="users" [size]="22" className="text-brand-pink" />
      </div>
    </div>
  </div>
</div>
