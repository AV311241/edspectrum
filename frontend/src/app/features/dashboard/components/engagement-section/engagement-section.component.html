<app-ui-card customClass="h-full flex flex-col justify-between">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-sm font-bold text-brand-ink tracking-tight">Engagement</h2>
    <app-ui-select
      value="All Schools"
      [options]="schoolOptions"
    />
  </div>

  <div class="grid grid-cols-2 gap-2 flex-1">
    @for (item of dashboardService.engagementMetrics(); track item.id) {
      <div class="p-2 rounded-xl bg-brand-bg border border-gray-100 flex flex-col justify-between gap-1.5 hover:bg-white hover:shadow-card transition-all">
        <div class="flex items-center justify-between">
          <div class="w-7 h-7 rounded-lg bg-brand-pink-soft flex items-center justify-center text-brand-pink shrink-0">
            <app-ui-icon [name]="item.icon" [size]="14" />
          </div>
        </div>

        <div class="min-w-0">
          <div class="text-base font-extrabold text-brand-ink leading-tight tabular-nums">
            {{ item.value }}
          </div>
          <div class="text-[11px] font-semibold text-slate-600 leading-snug mt-1 break-normal">
            {{ item.title }}
          </div>
          @if (item.subtitle) {
            <div class="text-[10px] font-medium text-slate-500 leading-snug mt-0.5 break-words">
              {{ item.subtitle }}
            </div>
          }
        </div>

        <div class="min-w-0">
          <div class="text-[10px] font-semibold text-emerald-700 leading-snug mb-1 break-words">
            {{ item.trend }}
          </div>
          <app-line-chart
            [isSparkline]="true"
            [points]="item.sparkline"
            [ariaLabel]="item.title + ' trend'"
          />
        </div>
      </div>
    }
  </div>
</app-ui-card>
