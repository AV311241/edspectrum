<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <form
    (ngSubmit)="submit()"
    class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-8 space-y-4"
  >
    <div>
      <h1 class="text-xl font-semibold text-slate-800">Akshara</h1>
      <p class="text-sm text-slate-500 mt-1">English Skill Building Program - sign in to continue</p>
    </div>

    @if (error()) {
      <div class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-md px-3 py-2" role="alert">
        {{ error() }}
      </div>
    }

    <label class="block text-sm text-slate-600">
      Email
      <input
        type="email"
        name="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </label>

    <label class="block text-sm text-slate-600">
      Password
      <input
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </label>

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-md bg-blue-600 hover:bg-blue-700 text-white py-2 text-sm font-medium disabled:opacity-50"
    >
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
