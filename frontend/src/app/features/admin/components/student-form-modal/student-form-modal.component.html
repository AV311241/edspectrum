<!--
  Create / edit a student. Field-level errors render only after the control has
  been touched, so a pristine form never greets the user in red.
-->
<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4 sm:p-6">
  <div
    class="fixed inset-0 bg-slate-900/45 backdrop-blur-[2px]"
    aria-hidden="true"
    (click)="cancelled.emit()"
  ></div>

  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="student-form-title"
    class="relative w-full max-w-2xl rounded-2xl bg-white shadow-2xl"
  >
    <header class="flex items-start justify-between gap-4 border-b border-gray-100 px-6 py-5">
      <div>
        <p class="text-label-xs uppercase tracking-wide text-slate-400">Student record</p>
        <h2 id="student-form-title" class="mt-0.5 text-headline-lg text-brand-ink">
          {{ isEdit() ? 'Edit student' : 'Add new student' }}
        </h2>
        @if (isEdit()) {
          <p class="mt-0.5 text-table-md text-brand-muted">
            {{ student()?.studentIdCode }} · {{ student()?.fullName }}
          </p>
        }
      </div>
      <button
        type="button"
        class="rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-gray-100 hover:text-brand-ink"
        aria-label="Close dialog"
        (click)="cancelled.emit()"
      >
        <app-ui-icon name="close" [size]="18" />
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 py-5">
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">
            Student ID <em class="not-italic text-brand-pink">*</em>
          </span>
          <input
            type="text"
            formControlName="studentIdCode"
            placeholder="STU-0001"
            autocomplete="off"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm placeholder:text-slate-400 focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          />
          @if (invalid('studentIdCode')) {
            <span class="text-[11px] font-medium text-red-500">Student ID is required (max 50 characters).</span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">Class</span>
          <select
            formControlName="classId"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          >
            <option [ngValue]="null">Not enrolled</option>
            @for (classSection of classes(); track classSection.id) {
              <option [ngValue]="classSection.id">
                {{ classSection.className }} · {{ classSection.academicYear ?? 'Year not set' }}
              </option>
            }
          </select>
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">
            First name <em class="not-italic text-brand-pink">*</em>
          </span>
          <input
            type="text"
            formControlName="firstName"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          />
          @if (invalid('firstName')) {
            <span class="text-[11px] font-medium text-red-500">First name is required.</span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">
            Last name <em class="not-italic text-brand-pink">*</em>
          </span>
          <input
            type="text"
            formControlName="lastName"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          />
          @if (invalid('lastName')) {
            <span class="text-[11px] font-medium text-red-500">Last name is required.</span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">
            School <em class="not-italic text-brand-pink">*</em>
          </span>
          <select
            formControlName="schoolId"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          >
            <option [ngValue]="null" disabled>Select a school</option>
            @for (school of schools(); track school.id) {
              <option [ngValue]="school.id">{{ school.name }} · {{ school.code }}</option>
            }
          </select>
          @if (invalid('schoolId')) {
            <span class="text-[11px] font-medium text-red-500">Select the school this student belongs to.</span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">Gender</span>
          <select
            formControlName="gender"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          >
            <option [ngValue]="null">Not recorded</option>
            @for (option of genders; track option) {
              <option [ngValue]="option">{{ option.replace('_', ' ') }}</option>
            }
          </select>
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-label-xs uppercase tracking-wide text-slate-500">Date of birth</span>
          <input
            type="date"
            formControlName="dateOfBirth"
            class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
          />
        </label>

        @if (isEdit()) {
          <label class="flex flex-col gap-1.5">
            <span class="text-label-xs uppercase tracking-wide text-slate-500">Status</span>
            <select
              formControlName="status"
              class="h-10 w-full rounded-lg border border-gray-200 bg-white px-3 text-sm text-brand-ink shadow-sm focus:border-brand-pink focus:outline-none focus:ring-2 focus:ring-brand-pink/20"
            >
              @for (option of statuses; track option) {
                <option [value]="option">{{ option }}</option>
              }
            </select>
          </label>
        }
      </div>

      <footer class="mt-6 flex justify-end gap-2.5 border-t border-gray-100 pt-5">
        <app-ui-button variant="outline" size="md" [disabled]="saving()" (btnClick)="cancelled.emit()">
          Cancel
        </app-ui-button>
        <app-ui-button variant="primary" size="md" type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEdit() ? 'Save changes' : 'Create student' }}
        </app-ui-button>
      </footer>
    </form>
  </section>
</div>
