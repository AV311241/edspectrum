<header class="dashboard-header">
  <div class="dashboard-header-copy">
    <div class="dashboard-title-wrap">
      <h1>Akshara</h1>
      <span>English Skill Building Program</span>
    </div>
    <p>Practical English for a Brighter Tomorrow</p>
  </div>

  <div class="dashboard-filter-wrap">
    <div class="filter-control">
      <app-ui-select
        label="Academic Year"
        [value]="dashboardService.activeFilters().academicYear"
        [options]="yearOptions"
        (valueChange)="dashboardService.updateFilter('academicYear', $event)"
      />
    </div>

    <div class="filter-control">
      <app-ui-select
        label="Month"
        [value]="dashboardService.activeFilters().month"
        [options]="monthOptions"
        (valueChange)="dashboardService.updateFilter('month', $event)"
      />
    </div>

    <div class="filter-control">
      <app-ui-select
        label="School"
        [value]="selectedSchoolValue()"
        [options]="schoolOptions()"
        [disabled]="headerFilters.schoolsLoading()"
        (valueChange)="onSchoolChange($event)"
      />
    </div>

    <div class="filter-control">
      <app-ui-select
        label="Class"
        [value]="selectedClassValue()"
        [options]="classOptions()"
        [disabled]="headerFilters.classesLoading()"
        (valueChange)="onClassChange($event)"
      />
    </div>

    <div class="dashboard-header-badge">
      <div class="dashboard-header-badge-copy">
        <span>Learning</span>
        <span>Confidence</span>
        <span>Opportunities</span>
      </div>
      <div class="dashboard-header-badge-icon">
        <app-ui-icon name="leaf" [size]="16" />
      </div>
    </div>

    @if (auth.user(); as user) {
      <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
        <span class="text-sm text-slate-600 hidden md:inline">
          {{ user.firstName }} {{ user.lastName }}
        </span>
        <button
          type="button"
          (click)="auth.logout()"
          class="text-sm rounded-md border border-slate-300 px-3 py-1.5 text-slate-600 hover:bg-slate-100"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</header>
