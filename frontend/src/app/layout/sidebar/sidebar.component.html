<aside class="dashboard-sidebar-panel">
  <div class="dashboard-sidebar-brand">
    <div class="dashboard-sidebar-logo">
      <app-ui-icon name="leaf" [size]="22" className="text-brand-pink" />
    </div>
    <div class="dashboard-sidebar-brand-copy">
      <h1>Edspectrum</h1>
      <span>Foundation</span>
      <p>Every Child. A Brighter Future.</p>
    </div>
  </div>

  <nav class="dashboard-sidebar-nav">
    @for (item of navItems(); track item.id) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        [title]="item.label"
        class="dashboard-sidebar-link">
        <app-ui-icon [name]="item.icon" [size]="18" className="text-slate-400" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="dashboard-sidebar-quote">
    <p>"Confident Learners.<br/>Brighter Futures."</p>
    <div class="dashboard-sidebar-quote-mark">
      <app-ui-icon name="leaf" [size]="12" className="text-pink-300" />
    </div>
  </div>

  <div class="dashboard-sidebar-footer">
    © 2026 Edspectrum Foundation. All rights reserved.
  </div>
</aside>
