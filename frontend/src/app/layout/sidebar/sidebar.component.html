<aside class="w-64 bg-[#0E1726] text-white flex flex-col h-screen sticky top-0 border-r border-slate-800 select-none z-30 shrink-0">
  <div class="p-5 border-b border-slate-800/80 bg-[#0B1220]">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#93004e] to-pink-500 flex items-center justify-center shadow-lg shadow-pink-900/30 shrink-0">
        <app-ui-icon name="leaf" [size]="22" className="text-white" />
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white leading-tight">Edspectrum</h1>
        <span class="text-xs font-semibold text-pink-400 block tracking-wide">Foundation</span>
        <p class="text-[10px] text-slate-400 font-medium tracking-tight mt-0.5">Every Child. A Brighter Future.</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    @for (item of navItems(); track item.id) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#93004e] text-white shadow-md shadow-pink-950/40 font-bold translate-x-0.5"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all duration-200 text-left text-slate-300 hover:text-white hover:bg-slate-800/60">
        <app-ui-icon [name]="item.icon" [size]="18" className="text-slate-400" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="p-4 m-3 rounded-2xl bg-gradient-to-b from-slate-800/40 to-slate-900/60 border border-slate-800/80 text-center">
    <p class="text-xs font-semibold italic text-slate-300 leading-snug">"Confident Learners.<br/>Brighter Futures."</p>
    <div class="mt-2 flex justify-center">
      <div class="w-6 h-6 rounded-full bg-pink-950/80 border border-pink-700/50 flex items-center justify-center">
        <app-ui-icon name="leaf" [size]="12" className="text-pink-400" />
      </div>
    </div>
  </div>

  <div class="p-3 border-t border-slate-800/80 text-center text-[10px] text-slate-500 font-medium">
    © 2026 Edspectrum Foundation. All rights reserved.
  </div>
</aside>
