<div class="dashboard-shell">
  <app-sidebar class="dashboard-sidebar" />
  <div class="dashboard-main">
    <main class="dashboard-main-inner">
      <!--
        The dashboard header owns the School/Class filters, which only make
        sense on the analytics pages. `/schools` and `/admin` each provide their
        own hierarchy controls, so the header is hidden there to avoid two
        competing filters on one screen.
      -->
      @if (!router.url.startsWith('/schools') && !router.url.startsWith('/admin')) {
        <app-header />
      }
      <ng-content></ng-content>
    </main>
    <footer class="dashboard-footer">
      Data for Learning. Impact for Life.
    </footer>
  </div>
</div>
