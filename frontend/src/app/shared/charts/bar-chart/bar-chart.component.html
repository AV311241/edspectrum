<div class="w-full flex flex-col h-full">
  <div class="flex items-center justify-end gap-4 mb-2 text-xs font-medium text-slate-600">
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded-xs bg-[#E2B3D0] inline-block"></span>
      <span>Baseline</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 rounded-xs bg-[#93004e] inline-block"></span>
      <span>Current</span>
    </div>
  </div>

  <div class="relative flex-1 min-h-[160px] flex items-end pt-6 pb-6 px-2">
    <div class="absolute inset-x-0 top-0 bottom-6 flex flex-col justify-between pointer-events-none border-b border-slate-200">
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">100</span>
        <div class="flex-1 border-b border-dashed border-slate-200"></div>
      </div>
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">80</span>
        <div class="flex-1 border-b border-dashed border-slate-200"></div>
      </div>
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">60</span>
        <div class="flex-1 border-b border-dashed border-slate-200"></div>
      </div>
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">40</span>
        <div class="flex-1 border-b border-dashed border-slate-200"></div>
      </div>
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">20</span>
        <div class="flex-1 border-b border-dashed border-slate-200"></div>
      </div>
      <div class="flex items-center text-[10px] text-slate-400 font-medium">
        <span class="w-7 text-right pr-2">0</span>
        <div class="flex-1 border-b border-slate-200"></div>
      </div>
    </div>

    <div class="w-full pl-7 flex justify-around items-end h-full z-10 gap-2">
      @for (item of data(); track item.domain) {
        <div class="flex flex-col items-center flex-1 h-full justify-end group">
          <div class="flex items-end gap-1 w-full justify-center max-w-[50px] h-full">
            <div class="relative flex flex-col items-center w-1/2 h-full justify-end">
              <span class="text-[10px] font-bold text-slate-600 mb-1 opacity-90">{{ item.baseline }}</span>
              <div 
                class="w-full bg-[#E2B3D0] rounded-t-xs transition-all duration-300 group-hover:brightness-95" 
                [style.height.%]="item.baseline">
              </div>
            </div>

            <div class="relative flex flex-col items-center w-1/2 h-full justify-end">
              <span class="text-[10px] font-bold text-[#93004e] mb-1 opacity-100">{{ item.current }}</span>
              <div 
                class="w-full bg-[#93004e] rounded-t-xs transition-all duration-300 group-hover:brightness-110" 
                [style.height.%]="item.current">
              </div>
            </div>
          </div>
          <span class="text-[11px] font-medium text-slate-600 mt-2 truncate max-w-full">{{ item.domain }}</span>
        </div>
      }
    </div>
  </div>
</div>
