<div class="chart-root">
  <div class="chart-legend">
    <div class="legend-item">
      <span class="legend-swatch" style="background:#E2B3D0"></span>
      <span>Baseline</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#93004e"></span>
      <span>Current</span>
    </div>
  </div>

  <div class="chart-area">
    <div class="grid-lines">
      <div class="grid-line"><span class="grid-line-label">100</span><span class="grid-line-track"></span></div>
      <div class="grid-line"><span class="grid-line-label">80</span><span class="grid-line-track"></span></div>
      <div class="grid-line"><span class="grid-line-label">60</span><span class="grid-line-track"></span></div>
      <div class="grid-line"><span class="grid-line-label">40</span><span class="grid-line-track"></span></div>
      <div class="grid-line"><span class="grid-line-label">20</span><span class="grid-line-track"></span></div>
      <div class="grid-line"><span class="grid-line-label">0</span><span class="grid-line-track"></span></div>
    </div>

    <div class="bar-row">
      @for (item of data(); track item.domain) {
        <div class="bar-group">
          <div class="bar-stack">
            <div class="bar-column baseline" [style.height.%]="item.baseline"></div>
            <div class="bar-column current" [style.height.%]="item.current"></div>
          </div>
          <div class="bar-label">{{ item.domain }}</div>
        </div>
      }
    </div>
  </div>
</div>
