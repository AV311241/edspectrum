<div class="flex flex-col items-center justify-center w-full">
  <div class="relative w-32 h-32 flex items-center justify-center">
    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
      <circle
        cx="18"
        cy="18"
        r="14"
        fill="none"
        stroke="#f1f5f9"
        stroke-width="5"
      />

      <!-- Support: brand pink (SAS needs-support tier) -->
      <circle
        cx="18"
        cy="18"
        r="14"
        fill="none"
        stroke="#c02672"
        stroke-width="5"
        stroke-dasharray="21 88"
        stroke-dashoffset="0"
      />

      <!-- Stretch: amber watch tier -->
      <circle
        cx="18"
        cy="18"
        r="14"
        fill="none"
        stroke="#f59e0b"
        stroke-width="5"
        stroke-dasharray="22 88"
        stroke-dashoffset="-21"
      />

      <!-- Achievers: remaining cohort -->
      <circle
        cx="18"
        cy="18"
        r="14"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="5"
        stroke-dasharray="45 88"
        stroke-dashoffset="-43"
      />
    </svg>

    <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
      <span class="text-xl font-extrabold text-brand-ink leading-none">{{ totalStudents() }}</span>
      <span class="text-[9px] font-medium text-slate-400 uppercase tracking-wider">Students</span>
    </div>
  </div>

  <div class="flex items-center justify-center gap-4 mt-3 text-[10px] font-medium text-slate-600">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-brand-pink"></span>
      <span>Support</span>
      <span class="font-semibold text-slate-800">24%</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400"></span>
      <span>Stretch</span>
      <span class="font-semibold text-slate-800">25%</span>
    </div>
  </div>
</div>
