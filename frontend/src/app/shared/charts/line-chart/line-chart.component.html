@if (isSparkline()) {
  <div class="w-full h-8 flex items-end">
    <svg class="w-full h-full overflow-visible" viewBox="0 0 100 30" preserveAspectRatio="none">
      <path
        [attr.d]="sparklineD()"
        fill="none"
        stroke="#c02672"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
} @else {
  <div class="w-full flex flex-col h-full">
    <div class="relative flex-1 min-h-[120px] pt-4 pb-6">
      <div class="absolute inset-0 flex flex-col justify-between pointer-events-none border-b border-gray-200">
        <div class="text-[9px] text-slate-400 font-medium">40</div>
        <div class="text-[9px] text-slate-400 font-medium">30</div>
        <div class="text-[9px] text-slate-400 font-medium">20</div>
        <div class="text-[9px] text-slate-400 font-medium">10</div>
        <div class="text-[9px] text-slate-400 font-medium">0</div>
      </div>

      <div class="relative w-full h-full pl-6">
        <svg class="w-full h-full overflow-visible" viewBox="0 0 300 100" preserveAspectRatio="none">
          <path
            d="M 10 75 Q 60 50 110 40 T 210 25 T 290 30"
            fill="none"
            stroke="#c02672"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <circle cx="10" cy="75" r="3.5" fill="#c02672" />
          <circle cx="66" cy="55" r="3.5" fill="#c02672" />
          <circle cx="122" cy="45" r="3.5" fill="#c02672" />
          <circle cx="178" cy="30" r="3.5" fill="#c02672" />
          <circle cx="234" cy="25" r="3.5" fill="#c02672" />
          <circle cx="290" cy="32" r="3.5" fill="#c02672" />
        </svg>
      </div>
    </div>
    <div class="flex justify-between pl-6 text-[10px] font-medium text-slate-500 mt-1">
      <span>Apr</span>
      <span>May</span>
      <span>Jun</span>
      <span>Jul</span>
      <span>Aug</span>
      <span>Sep</span>
    </div>
  </div>
}
