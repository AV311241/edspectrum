<div class="flex flex-col justify-around w-full h-full gap-3 py-1">
  @for (item of items(); track item.stage; let idx = $index) {
    <div class="flex items-center gap-3 w-full">
      <span class="w-16 text-xs font-semibold text-slate-700 shrink-0">{{ item.stage }}</span>
      <div class="flex-1 flex items-center gap-2.5">
        <div class="flex-1 bg-pink-50/50 h-5 rounded-md p-0.5 relative overflow-hidden border border-pink-100/50">
          <div 
            [class]="'h-full rounded-sm transition-all duration-500 shadow-2xs ' + getBarColorClass(idx)" 
            [style.width.%]="getScaledWidth(item.percentage)">
          </div>
        </div>
        <span class="w-10 text-xs font-bold text-slate-700 shrink-0 text-left">{{ item.percentage }}%</span>
      </div>
    </div>
  }
</div>
