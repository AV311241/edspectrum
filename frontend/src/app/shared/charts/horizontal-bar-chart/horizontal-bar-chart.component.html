<div class="chart-root">
  @for (item of items(); track item.stage; let idx = $index) {
    <div class="chart-row">
      <span class="chart-label">{{ item.stage }}</span>
      <div class="track">
        <div
          [class]="'bar-fill ' + getBarColorClass(idx)"
          [style.width.%]="getScaledWidth(item.percentage)">
        </div>
      </div>
      <span class="value">{{ item.percentage }}%</span>
    </div>
  }
</div>
