<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="selectId()" class="text-[11px] font-semibold tracking-wider text-slate-500 uppercase">{{ label() }}</label>
  }
  <div class="relative min-w-[130px]">
    <select
      [id]="selectId()"
      [value]="value()"
      (change)="onSelectionChange($event)"
      class="w-full appearance-none bg-white border border-slate-200 rounded-lg px-3 py-1.5 pr-8 text-xs font-semibold text-slate-700 shadow-xs focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 cursor-pointer">
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
      <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20">
        <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
      </svg>
    </div>
  </div>
</div>
