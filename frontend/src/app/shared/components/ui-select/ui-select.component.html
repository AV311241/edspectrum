<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="selectId()" class="text-[10px] font-medium text-slate-500 leading-none">
      {{ label() }}
    </label>
  }
  <div class="relative min-w-[130px]">
    <select
      [id]="selectId()"
      [value]="value()"
      [disabled]="disabled()"
      (change)="onSelectionChange($event)"
      class="h-10 w-full min-w-[130px] appearance-none bg-white border border-gray-200 rounded-lg px-3 py-2 pr-8 text-xs font-medium text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-brand-pink cursor-pointer disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-400">
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
      <svg class="h-3.5 w-3.5 fill-current" viewBox="0 0 20 20">
        <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
      </svg>
    </div>
  </div>
</div>
