<!--
  Card surface per the Akshara spec: white, subtle gray-100 outline and a
  light drop shadow that deepens on hover.
-->
<div
  [class]="
    'card-shell bg-white rounded-2xl border border-gray-100 p-4 sm:p-5 ' +
    'shadow-card transition-shadow duration-200 hover:shadow-card-hover ' +
    customClass()
  ">
  <ng-content></ng-content>
</div>
