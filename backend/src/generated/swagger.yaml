    MutationMessageDTO:
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
      type: object
      additionalProperties: false
    UncancelClassAttendanceInput:
      properties:
        classId:
          type: number
          format: double
        sessionDate:
          type: string
      required:
        - classId
        - sessionDate
      type: object
      additionalProperties: false
    DailyRegisterEntryDTO:
      properties:
        studentId:
          type: number
          format: double
        studentIdCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          anyOf:
            - $ref: "#/components/schemas/AttendanceStatus"
            - type: string
              enum:
                - UNMARKED
        remarks:
          type: string
          nullable: true
        attendanceId:
          type: string
          nullable: true
      required:
        - studentId
        - studentIdCode
        - firstName
        - lastName
        - status
        - remarks
        - attendanceId
      type: object
      additionalProperties: false
    DailyRegisterResponseDTO:
      properties:
        classId:
          type: number
          format: double
        className:
          type: string
        sessionDate:
          type: string
        cancelled:
          type: boolean
        cancellationRemarks:
          type: string
          nullable: true
        enrolledCount:
          type: number
          format: double
        markedCount:
          type: number
          format: double
        presentCount:
          type: number
          format: double
        absentCount:
          type: number
          format: double
        halfDayCount:
          type: number
          format: double
        activityCount:
          type: number
          format: double
        entries:
          items:
            $ref: "#/components/schemas/DailyRegisterEntryDTO"
          type: array
      required:
        - classId
        - className
        - sessionDate
        - cancelled
        - cancellationRemarks
        - enrolledCount
        - markedCount
        - presentCount
        - absentCount
        - halfDayCount
        - activityCount
        - entries
      type: object
      additionalProperties: false
    AttendanceRiskLevel:
      enum:
        - STABLE
        - WATCH
        - AT_RISK
        - CRITICAL
      type: string
    StudentMonthlyAnalyticsDTO:
      properties:
        studentId:
          type: number
          format: double
        studentIdCode:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        presentDays:
          type: number
          format: double
        absentDays:
          type: number
          format: double
        halfDays:
          type: number
          format: double
        activityDays:
          type: number
          format: double
        unmarkedDays:
          type: number
          format: double
        workingDays:
          type: number
          format: double
        attendancePercent:
          type: number
          format: double
        consecutiveAbsences:
          type: number
          format: double
        maxConsecutiveAbsences:
          type: number
          format: double
        riskLevel:
          $ref: "#/components/schemas/AttendanceRiskLevel"
      required:
        - studentId
        - studentIdCode
        - firstName
        - lastName
        - presentDays
        - absentDays
        - halfDays
        - activityDays
        - unmarkedDays
        - workingDays
        - attendancePercent
        - consecutiveAbsences
        - maxConsecutiveAbsences
        - riskLevel
      type: object
      additionalProperties: false
    MonthlyAttendanceAnalyticsDTO:
      properties:
        classId:
          type: number
          format: double
        className:
          type: string
        year:
          type: number
          format: double
        month:
          type: number
          format: double
        workingDays:
          type: number
          format: double
        cancelledDays:
          type: number
          format: double
        classAveragePercent:
          type: number
          format: double
        atRiskCount:
          type: number
          format: double
        students:
          items:
            $ref: "#/components/schemas/StudentMonthlyAnalyticsDTO"
          type: array
      required:
        - classId
        - className
        - year
        - month
        - workingDays
        - cancelledDays
        - classAveragePercent
        - atRiskCount
        - students
      type: object
      additionalProperties: false
    PaginatedAttendanceResponseDTO:
      properties:
        records:
          items:
            $ref: "#/components/schemas/AttendanceResponseDTO"
          type: array
        total:
          type: number
          format: double
        page:
          type: number
          format: double
        limit:
          type: number
          format: double
        totalPages:
          type: number
          format: double
      required:
        - records
        - total
        - page
        - limit
        - totalPages
      type: object
      additionalProperties: false
    UpdateAttendanceInput:
      properties:
        status:
          $ref: "#/components/schemas/AttendanceStatus"
        remarks:
          type: string
          nullable: true
      type: object
      additionalProperties: false
  securitySchemes: {}
info:
  title: lumino1-backend
  version: 1.0.0
  description: Lumino1 NGO Baseline Assessment Production-Ready Express TypeScript Backend
  license:
    name: ISC
  contact:
    name: Edspectrum NGO
paths:
  /users:
    get:
      operationId: GetUsers
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserResponseDTO"
                type: array
      description: Retrieve all registered users
      tags:
        - Users
      security: []
      parameters: []
    post:
      operationId: CreateUser
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
      description: Create a new user profile
      tags:
        - Users
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDTO"
  /users/{id}:
    get:
      operationId: GetUserById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "404":
          description: User not found
      description: Retrieve user details by numeric ID
      tags:
        - Users
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
  /students:
    post:
      operationId: CreateStudent
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "400":
          description: Bad Request - Validation Error
        "409":
          description: Conflict - Student code already exists or class capacity reached
      description: Create a new Student record
      tags:
        - Students
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentInput"
    get:
      operationId: ListStudents
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStudentResponseDTO"
      description: List paginated Students with optional filters
      tags:
        - Students
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: schoolId
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: classId
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/StudentStatus"
        - in: query
          name: search
          required: false
          schema:
            type: string
  /students/batch:
    post:
      operationId: BatchUploadStudents
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchStudentUploadResultDTO"
        "400":
          description: Bad Request - Validation Error
      description: >-
        Bulk create Students from a code-based Excel upload.

        Resolves `schoolCode` and `(schoolCode, className, academicYear)` to
        their

        primary keys server-side, splits `studentName`, and enrols each student.
      tags:
        - Students
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStudentUploadInput"
  /students/{id}:
    get:
      operationId: GetStudentById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "404":
          description: Student not found
      description: Get Student details by numeric ID
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
    put:
      operationId: UpdateStudent
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "404":
          description: Student not found
        "409":
          description: Conflict - Student code duplicate
      description: Update Student profile by ID
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentInput"
    delete:
      operationId: DeleteStudent
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                required:
                  - message
                  - success
                type: object
        "404":
          description: Student not found
      description: Delete Student by ID
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
  /students/{id}/enroll:
    post:
      operationId: EnrollStudent
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "400":
          description: Bad Request - Student or Class inactive
        "404":
          description: Student or Class not found
        "409":
          description: Conflict - Already enrolled or Class capacity limit reached
      description: Enroll Student into a Class Section
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollStudentInput"
  /students/{id}/unenroll:
    post:
      operationId: UnenrollStudent
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "400":
          description: Bad Request - Student not currently enrolled
        "404":
          description: Student not found
      description: Unenroll Student from a Class Section
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnenrollStudentInput"
  /students/{id}/transfer:
    post:
      operationId: TransferStudent
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentResponseDTO"
        "400":
          description: Bad Request - Invalid transfer source/target or inactive class
        "404":
          description: Student or Target Class not found
        "409":
          description: Conflict - Target class capacity limit reached or duplicate
            enrollment
      description: Transfer Student from one Class Section to another
      tags:
        - Students
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStudentInput"
  /classes:
    post:
      operationId: CreateClass
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
        "400":
          description: Bad Request - Validation Error
        "404":
          description: School or Grade not found
        "409":
          description: Conflict - Section already exists for School/Grade
      description: Create a new Class Section
      tags:
        - Classes
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassInput"
    get:
      operationId: ListClasses
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClassResponseDTO"
      description: List paginated Class Sections with optional filters
      tags:
        - Classes
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: schoolId
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: gradeId
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/ClassStatus"
        - in: query
          name: academicYear
          required: false
          schema:
            type: string
        - in: query
          name: search
          required: false
          schema:
            type: string
  /classes/batch:
    post:
      operationId: BatchUploadClasses
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchClassUploadResultDTO"
        "400":
          description: Bad Request - Validation Error
      description: |-
        Bulk create Class Sections from a code-based Excel upload.
        Resolves `schoolCode` to `School.id` server-side and reports row-level
        failures without aborting the rest of the upload.
      tags:
        - Classes
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchClassUploadInput"
  /classes/{id}:
    get:
      operationId: GetClassById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
        "404":
          description: Class Section not found
      description: Get Class Section details by numeric ID
      tags:
        - Classes
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
    put:
      operationId: UpdateClass
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassResponseDTO"
        "400":
          description: Bad Request - Reduced capacity below enrolled count
        "404":
          description: Class Section not found
        "409":
          description: Conflict - Section duplicate
      description: Update Class Section by ID
      tags:
        - Classes
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassInput"
    delete:
      operationId: DeleteClass
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                required:
                  - message
                  - success
                type: object
        "404":
          description: Class Section not found
        "409":
          description: Conflict - Cannot delete class with active enrolled students
      description: Delete Class Section by ID (Enforces non-empty safeguard)
      tags:
        - Classes
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
  /classes/{id}/students:
    get:
      operationId: GetEnrolledStudents
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  totalPages:
                    type: number
                    format: double
                  page:
                    type: number
                    format: double
                  total:
                    type: number
                    format: double
                  records:
                    items:
                      $ref: "#/components/schemas/EnrolledStudentSummaryDTO"
                    type: array
                required:
                  - totalPages
                  - page
                  - total
                  - records
                type: object
        "404":
          description: Class Section not found
      description: Get paginated list of active enrolled students in a Class Section
      tags:
        - Classes
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
  /baseline-assessments:
    post:
      operationId: Create
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineAssessmentRecord"
      description: Create a new Baseline Assessment
      tags:
        - Baseline Assessments
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBaselineAssessmentInput"
    get:
      operationId: List
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBaselineAssessmentResponse"
      description: List paginated Baseline Assessments
      tags:
        - Baseline Assessments
      security: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            format: double
            type: number
        - in: query
          name: limit
          required: false
          schema:
            format: double
            type: number
  /baseline-assessments/import:
    post:
      operationId: ImportAssessments
      responses:
        "201":
          description: Bulk Imported
          content:
            application/json:
              schema:
                properties:
                  records:
                    items:
                      $ref: "#/components/schemas/BaselineAssessmentRecord"
                    type: array
                  importedCount:
                    type: number
                    format: double
                required:
                  - records
                  - importedCount
                type: object
      description: Bulk import Baseline Assessments
      tags:
        - Baseline Assessments
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportBaselineAssessmentInput"
  /baseline-assessments/export/flat:
    get:
      operationId: ExportFlat
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Record_string.unknown_"
                type: array
      description: Export flat wide matrix for Baseline Assessments
      tags:
        - Baseline Assessments
      security: []
      parameters: []
  /baseline-assessments/{id}:
    get:
      operationId: GetById
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineAssessmentRecord"
        "404":
          description: Assessment not found
      description: Get Baseline Assessment by numeric ID
      tags:
        - Baseline Assessments
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
    put:
      operationId: Update
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineAssessmentRecord"
        "404":
          description: Assessment not found
      description: Update Baseline Assessment by ID
      tags:
        - Baseline Assessments
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBaselineAssessmentInput"
    delete:
      operationId: DeleteAssessment
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
        "404":
          description: Assessment not found
      description: Delete Baseline Assessment by ID
      tags:
        - Baseline Assessments
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: double
            type: number
  /baseline-assessments/student/{studentId}:
    get:
      operationId: GetByStudentId
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BaselineAssessmentRecord"
                type: array
      description: Get Baseline Assessments by Student ID
      tags:
        - Baseline Assessments
      security: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
  /attendance/batch-upload:
    post:
      operationId: BulkUploadAttendance
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAttendanceUploadResultDTO"
        "400":
          description: Bad Request - Validation Error
      description: >-
        Bulk upload Daily Attendance from a code-based Excel upload.


        Unlike `POST /attendance/batch` (which takes numeric `classId` /
        `studentId`

        foreign keys for a single class session), this endpoint accepts the

        human-facing spreadsheet codes and resolves them server-side.
        `CANCELLED`

        rows become class-wide cancellation records and require `remarks`.
      tags:
        - Attendance
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAttendanceUploadInput"
  /attendance/batch:
    post:
      operationId: BatchUpsertAttendance
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpsertAttendanceResponseDTO"
        "400":
          description: Bad Request - Validation Error or Class is Cancelled
        "404":
          description: Class Section not found
      description: Batch mark or update daily attendance records for a class section
      tags:
        - Attendance
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpsertAttendanceInput"
  /attendance/cancel-class:
    post:
      operationId: CancelClassSession
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassCancellationResponseDTO"
        "400":
          description: Bad Request - Validation Error
        "404":
          description: Class Section not found
      description: Cancel an entire class session for a specific date
      tags:
        - Attendance
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelClassAttendanceInput"
  /attendance/uncancel-class:
    post:
      operationId: UncancelClassSession
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationMessageDTO"
        "400":
          description: Bad Request - Validation Error
        "404":
          description: Class Section not found
      description: Remove class session cancellation flag for a specific date
      tags:
        - Attendance
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UncancelClassAttendanceInput"
  /attendance/register:
    get:
      operationId: GetDailyRegister
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRegisterResponseDTO"
